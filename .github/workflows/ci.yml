name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        name: Install pnpm
        with:
          standalone: true
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        name: Install Node.js
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Test
        run: pnpm test

  peer-floor:
    name: Peer floor (${{ matrix.name }})
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: typescript
            # 5.0.0 was never published on npm; 5.0.2 is the first release
            # satisfying peerDependencies.typescript's ">=5.0.0". valibot
            # stays at the pinned version for this row.
            packages: typescript@5.0.2
          - name: valibot
            # typescript stays at the pinned version for this row.
            packages: valibot@1.1.0
          - name: combined
            # Both peerDependencies lower bounds installed together, since
            # consumers can be at both floors simultaneously.
            packages: typescript@5.0.2 valibot@1.1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        name: Install pnpm
        with:
          standalone: true
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        name: Install Node.js
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install peerDependencies lower bound
        run: pnpm add -D ${{ matrix.packages }}
      - name: Typecheck (tsgo)
        run: pnpm typecheck
      - name: Typecheck (tsc)
        run: pnpm typecheck:tsc
      - name: Test
        run: pnpm test
